services:
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/openclaw-odoo/Dockerfile
      args:
        OPENCLAW_TAG: latest
    image: openclaw-odoo:local
    container_name: openclaw
    restart: unless-stopped
    volumes:
      - ./config:/home/node/.openclaw
      - ./data:/home/node/.openclaw-data
